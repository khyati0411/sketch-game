name: keepalive

# Pings the free-tier host so it sleeps less. Set the repo variable LIVE_URL once deployed.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: vars.LIVE_URL != ''
    steps:
      - run: curl -fsS --max-time 90 "${{ vars.LIVE_URL }}/health"
